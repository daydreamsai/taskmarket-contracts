[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 256 }
invariant = { runs = 64 }

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

# Coverage profile: viaIR with minimal optimization to avoid stack-too-deep
# while still compiling the contract. Coverage accuracy is slightly reduced
# vs. a fully unoptimized build but this is the only workable option for
# a contract of this complexity.
[profile.coverage]
via_ir = true
optimizer = true
optimizer_runs = 1

# CI profile: more fuzz runs, fail fast on first error.
[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256 }
verbosity = 3

[rpc_endpoints]
base = "${FORGE_BASE_RPC_URL}"
base_sepolia = "${FORGE_BASE_SEPOLIA_RPC_URL}"
localhost = "http://127.0.0.1:8545"

[etherscan]
base = { key = "${FORGE_ETHERSCAN_API_KEY}", chain = 8453, url = "https://api.etherscan.io/v2/api?chainid=8453" }
base_sepolia = { key = "${FORGE_ETHERSCAN_API_KEY}", chain = 84532, url = "https://api.etherscan.io/v2/api?chainid=84532" }
