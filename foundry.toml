[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 256 }
invariant = { runs = 64 }
# NOTE: the upgrade-step tests must run single-threaded -- `forge test -j 1`, which is what
# `make test` and the package's test scripts pass. The RevNNNUpgrade scripts take their target
# diamond from FORGE_DIAMOND_ADDRESS_*, and `vm.setEnv` writes the one process-wide environment
# that every concurrently-executing test suite shares, so parallel suites retarget each other's
# steps mid-sequence. A bare parallel `forge test` fails intermittently, in a different suite each
# run. The `threads` config key here is NOT honoured by the test runner (only the CLI flag is),
# which is why this is a comment and not a setting.
# DiamondSelectorParity.t.sol enumerates the upgrade-step scripts to assert the fresh-deploy
# version seed matches the highest one, so it needs to read that directory listing.
fs_permissions = [{ access = "read", path = "./script/upgrades" }]
# Emitted on every build so `forge inspect <c> storageLayout` works without a clean rebuild.
# Without it the layout is absent from the artifact and `forge inspect` errors -- which reads
# very much like "this contract has no storage" if the caller is not careful. `make contract
# storage-check` depends on the difference: TaskTokenRewardHook sits behind a proxy and must
# have no sequential storage, and an unreadable layout must never be mistaken for an empty one.
extra_output = ["storageLayout"]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

# CI profile: more fuzz runs, fail fast on first error.
[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256 }
verbosity = 3

[rpc_endpoints]
base = "${FORGE_BASE_RPC_URL}"
base_sepolia = "${FORGE_BASE_SEPOLIA_RPC_URL}"
localhost = "http://127.0.0.1:8545"

[etherscan]
base = { key = "${FORGE_ETHERSCAN_API_KEY}", chain = 8453, url = "https://api.etherscan.io/v2/api?chainid=8453" }
base_sepolia = { key = "${FORGE_ETHERSCAN_API_KEY}", chain = 84532, url = "https://api.etherscan.io/v2/api?chainid=84532" }
