[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 256 }
invariant = { runs = 64 }
# NOTE: the upgrade-step tests must run single-threaded -- `forge test -j 1`, which is what
# `make test` and the package's test scripts pass. The RevNNNUpgrade scripts take their target
# diamond from FORGE_DIAMOND_ADDRESS_*, and `vm.setEnv` writes the one process-wide environment
# that every concurrently-executing test suite shares, so parallel suites retarget each other's
# steps mid-sequence. A bare parallel `forge test` fails intermittently, in a different suite each
# run. The `threads` config key here is NOT honoured by the test runner (only the CLI flag is),
# which is why this is a comment and not a setting.
# DiamondSelectorParity.t.sol enumerates the upgrade-step scripts to assert the fresh-deploy
# version seed matches the highest one, so it needs to read that directory listing.
# RemoteSponsoredTaskHookFundingVector.t.sol replays the backend-built funding vectors.
# ProjectPayRequesterScan.t.sol scans the facets and libraries for a direct payout to a requester.
fs_permissions = [
    { access = "read", path = "./script/upgrades" },
    { access = "read", path = "../docs/specs/sponsored-tasks/vectors" },
    { access = "read", path = "./src/facets" },
    { access = "read", path = "./src/libraries" },
]
# Emitted on every build so `forge inspect <c> storageLayout` works without a clean rebuild.
# Without it the layout is absent from the artifact and `forge inspect` errors -- which reads
# very much like "this contract has no storage" if the caller is not careful. `make contract
# storage-check` depends on the difference: TaskTokenRewardHook sits behind a proxy and must
# have no sequential storage, and an unreadable layout must never be mistaken for an empty one.
extra_output = ["storageLayout"]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

# CI profile: more fuzz runs, fail fast on first error.
[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256 }
verbosity = 3

# Tempo profile: `FOUNDRY_PROFILE=tempo` (the Makefile's tempo-* targets set it). Enables forge's
# Tempo network family so scripts broadcast Tempo transactions and accept `--tempo.fee-token`.
# Tempo has no native gas token: fees are paid in a TIP-20 stablecoin.
[profile.tempo]
network = "tempo"

[rpc_endpoints]
"8453" = "${FORGE_RPC_URL_8453}"
"84532" = "${FORGE_RPC_URL_84532}"
"4217" = "${FORGE_RPC_URL_4217}"
"42431" = "${FORGE_RPC_URL_42431}"
"4663" = "${FORGE_RPC_URL_4663}"
"46630" = "${FORGE_RPC_URL_46630}"
localhost = "http://127.0.0.1:8545"

[etherscan]
"8453" = { key = "${FORGE_ETHERSCAN_API_KEY}", chain = 8453, url = "https://api.etherscan.io/v2/api?chainid=8453" }
"84532" = { key = "${FORGE_ETHERSCAN_API_KEY}", chain = 84532, url = "https://api.etherscan.io/v2/api?chainid=84532" }
# Robinhood Chain explorers are Blockscout, which takes an Etherscan-style API and ignores the key.
"4663" = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }
"46630" = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
