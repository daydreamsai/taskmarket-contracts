[package]
name = "sponsored-tasks"
version = "0.1.0"
description = "Taskmarket Sponsored Tasks vault for Solana"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "sponsored_tasks"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "=1.2.1"

[dev-dependencies]
litesvm = "=0.12.0"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-message = "3.1"
solana-signer = "3.0"
solana-transaction = "3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
