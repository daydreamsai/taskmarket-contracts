[package]
name = "sponsored-tasks"
version = "0.1.0"
description = "Taskmarket Sponsored Tasks vault for Solana"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "sponsored_tasks"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.2.1", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v3", "token", "mint", "token_2022", "token_2022_extensions", "associated_token"] }

[dev-dependencies]
litesvm = "=0.12.0"
solana-account = "3.4"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-message = "3.1"
solana-program-pack = "3.1"
solana-signer = "3.0"
solana-system-interface = { version = "3.3", features = ["bincode"] }
solana-transaction = "3.0"
spl-associated-token-account-interface = "2.0"
spl-token-2022-interface = "2.1"
spl-token-interface = "2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
